; =============================================================================
; HW2-PerfBoost: Optional User Engine.ini Tweaks
; =============================================================================
; NOTE: The main HW2PerfBoost_*_P.pak mod already includes all core engine,
; scalability, VisualQualityOptions, shadow, and VR fixes.
;
; Only use this file if you want to tweak extra settings manually in:
;   Windows: %LOCALAPPDATA%\HW2\Saved\Config\WindowsNoEditor\Engine.ini
;   Linux:   ~/.local/share/Steam/steamapps/compatdata/2287520/pfx/drive_c/users/steamuser/AppData/Local/HW2/Saved/Config/WindowsNoEditor/Engine.ini
; =============================================================================

[SystemSettings]
; Reduce frame latency and improve GPU/CPU overlap
r.GTSyncType=1
r.OneFrameThreadLag=1
r.FinishCurrentFrame=0

; Async shader compilation & caching (reduces first-time traversal stutters)
r.CreateShadersOnLoad=1
r.UseShaderCaching=1
r.UseShaderPredraw=1

; Parallel command list & mesh draw instancing
r.MeshDrawCommands.DynamicInstancing=1
r.MeshDrawCommands.UseCachedCommands=1
r.MeshDrawCommands.ParallelPassSetup=1
r.ParallelRendering=1
r.ParallelShadows=1
r.ParallelBasePass=1
r.ParallelTranslucency=1
r.ParallelPrePass=1

; Texture streaming stability (adjust PoolSize: 2048 for 4GB VRAM, 3072 for 6-8GB, 4096 for 12GB+)
r.Streaming.PoolSize=3072
r.Streaming.LimitPoolSizeToVRAM=1
r.Streaming.Boost=1
r.Streaming.FramesForFullUpdate=2
r.MaxAnisotropy=8

; Disable post-process blur/vignette/chromatic aberration overhead
r.DefaultFeature.MotionBlur=0
r.MotionBlurQuality=0
r.DepthOfFieldQuality=0
r.LensFlareQuality=0
r.SceneColorFringeQuality=0

[/Script/Engine.GarbageCollectionSettings]
gc.TimeBetweenPurgingPendingKillObjects=90.0
gc.AllowParallelGC=True
gc.MultithreadedDestructionEnabled=True
